# BACKGROUND
background {
    #monitor =
    path = ~/.config/hypr/hyprlock.png
    blur_passes = 4
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# TIME
label {
    monitor =
     text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 100
    font_family = JetBrains Mono Nerd Font
    position = 0, -90
    halign = center
    valign = top
}

