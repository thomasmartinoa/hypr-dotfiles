###############################################################################
###                      HYPRLAND ENVIRONMENT VARIABLES                     ###
###############################################################################
# Anything `env = NAME,VALUE` here is exported to every process Hyprland
# spawns after this file is loaded. To apply changes to already-running apps
# you must close and reopen them (or log out).
#
# Sections:
#   1. Session identity (XDG / Wayland)
#   2. Toolkit / backend selection (which apps go native Wayland vs XWayland)
#   3. HiDPI scaling (monitor scale = 1.60)
#   4. Cursor sizing
#   5. NVIDIA / GPU
#   6. Disabled / optional (kept for reference)
###############################################################################


# ─── 1. Session identity ─────────────────────────────────────────────────────
# Tells apps and portals that we're in a Wayland Hyprland session.
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland


# ─── 2. Toolkit / backend selection ──────────────────────────────────────────
# Order matters: native Wayland is sharper and avoids the XWayland scaling
# tax. We prefer Wayland, fall back to X11 only when a toolkit can't.

# GTK: try wayland, fall back to x11 if not supported by the app.
env = GDK_BACKEND,wayland,x11,*

# Qt: same idea — wayland first, xcb (X11) as fallback.
env = QT_QPA_PLATFORM,wayland;xcb

# Qt: don't draw client-side window decorations (Hyprland decorates).
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Qt: use qt5ct for theming (icons, fonts, colors).
env = QT_QPA_PLATFORMTHEME,qt5ct

# SDL games / apps: use Wayland directly.
env = SDL_VIDEODRIVER,wayland

# Clutter (GNOME-ish toolkit): use Wayland.
env = CLUTTER_BACKEND,wayland

# Electron (Discord, WhatsApp, VS Code, Slack, etc.): force Wayland-native
# rendering. Without this they default to XWayland and look blurry under
# fractional scaling.
env = ELECTRON_OZONE_PLATFORM_HINT,wayland


# ─── 3. HiDPI scaling (paired with `xwayland.force_zero_scaling = true`) ─────
# Monitor is QHD at scale 1.60. Native-Wayland apps get the scale automatically
# from the compositor. XWayland apps don't — we have to tell each toolkit by
# hand. Without these, X11 apps render tiny but sharp.

# GTK 3/4 (XWayland fallback path).
env = GDK_SCALE,1.6

# Qt 5/6 (XWayland fallback path) — e.g. VLC when launched in X11 mode.
env = QT_SCALE_FACTOR,1.6

# Qt: don't double-scale on top of QT_SCALE_FACTOR.
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# Java / Swing X11 apps (e.g. JetBrains IDEs, older Java tools).
env = _JAVA_OPTIONS,-Dsun.java2d.uiScale=1.6


# ─── 4. Cursor sizing ────────────────────────────────────────────────────────
# Both must agree, otherwise the cursor changes size as you move between
# Wayland windows and X11 windows.

# Keep these two in sync: XCURSOR_SIZE must equal HYPRCURSOR_SIZE * monitor_scale,
# otherwise the cursor changes size between Wayland and X11 windows.
# To resize: change HYPRCURSOR_SIZE, then set XCURSOR_SIZE = HYPRCURSOR_SIZE * 1.6.
# Reference: 16 logical = small, 20 = normal, 24 = large.

# Hyprland's own cursor (native Wayland). In logical px — compositor scales it.
env = HYPRCURSOR_SIZE,16

# X11 cursor over XWayland windows. 16 logical * 1.6 scale = ~26 physical px.
env = XCURSOR_SIZE,26


# ─── 5. NVIDIA / GPU ─────────────────────────────────────────────────────────
# Required pieces for the proprietary NVIDIA driver on Wayland.

# Force the NVIDIA GBM backend (instead of Mesa's, which can't talk to nvidia).
env = GBM_BACKEND,nvidia-drm

# VA-API hardware video decode (Firefox, mpv, OBS, etc.).
env = LIBVA_DRIVER_NAME,nvidia

# Tell GLX to use NVIDIA's vendor library. Commented out — leave off unless an
# X11 GL app misbehaves. Some setups break with it enabled.
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia


# ─── 6. Disabled / optional (kept for reference, uncomment if needed) ────────

# Use software cursors if hardware cursors flicker on NVIDIA. Costs a tiny bit
# of GPU; usually not needed on modern drivers.
#env = WLR_NO_HARDWARE_CURSORS,1

# NVIDIA PRIME render offload (for hybrid Intel+NVIDIA laptops, run a single
# app on the dGPU with `prime-run <app>`).
#env = __NV_PRIME_RENDER_OFFLOAD,1
#env = __VK_LAYER_NV_optimus,NVIDIA_only

# NVIDIA direct VA-API backend — can fix Firefox HW decode on some driver
# versions. Try if VA-API is broken.
#env = NVD_BACKEND,direct

# Force GTK file pickers etc. through xdg-desktop-portal (useful for Flatpaks).
#env = GTK_USE_PORTAL,1

# Firefox hardware acceleration tweaks (older driver versions).
#env = MOZ_DISABLE_RDD_SANDBOX,1
#env = EGL_PLATFORM,wayland

# Force software rendering — only useful inside KVM / VMs without GPU passthrough.
#env = WLR_RENDERER_ALLOW_SOFTWARE,1
#env = LIBGL_ALWAYS_SOFTWARE,1
