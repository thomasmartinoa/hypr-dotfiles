# Run the greeter under Hyprland instead of X11, like Omarchy. Same GPU path
# and scaling as the real session. If the login screen ever comes up black,
# delete this file from /etc/sddm.conf.d/ (TTY: Ctrl+Alt+F3) and SDDM falls
# back to X11 with the same theme.
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/sddm/hyprland.lua
EnableHiDPI=true
