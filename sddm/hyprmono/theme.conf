[General]
# Wallpaper. Same image hyprlock uses, copied in because the sddm user
# cannot read ~/.config.
background=background.png
# Blur the wallpaper like hyprlock (blur_passes = 4).
blur=true
# Font family for everything.
font=JetBrainsMono Nerd Font Propo
# 12h clock like hyprlock ("9:41PM"). Set false for 24h.
clock12h=true
# Session to preselect when SDDM has no memory of the last one.
# Substring matched against the session name, e.g. "uwsm" or "Hyprland".
preferSession=Hyprland
