; hypr-dotfiles — monochrome Qt colour scheme
; ============================================================================
; Mirrors ~/.config/hypr-theme/palette.css. Qt cannot import, so these values
; are duplicated by hand — keep them in step with the palette.
;
; Each row is 22 #AARRGGBB values in Qt::ColorRole order:
;   0 WindowText  1 Button      2 Light       3 Midlight   4 Dark
;   5 Mid         6 Text        7 BrightText  8 ButtonText 9 Base
;  10 Window     11 Shadow     12 Highlight  13 HighlightedText
;  14 Link       15 LinkVisited 16 AlternateBase 17 NoRole
;  18 ToolTipBase 19 ToolTipText 20 PlaceholderText 21 Accent
;
; This replaces the previous scheme, whose Highlight/Link/Accent roles were
; still GNOME blue (#3584e4, #15539e, #1b6acb, #308cc6).
[ColorScheme]
active_colors=#ffe8e8e8, #ff1e1e1e, #ff333333, #ff282828, #ff0a0a0a, #ff141414, #ffe8e8e8, #ffffffff, #ffe8e8e8, #ff141414, #ff0a0a0a, #19000000, #ffe0e0e0, #ff0a0a0a, #ffffffff, #ffa0a0a0, #ff1e1e1e, #ff000000, #f21e1e1e, #ffe8e8e8, #ff606060, #ffffffff
inactive_colors=#ffe8e8e8, #ff1e1e1e, #ff333333, #ff282828, #ff0a0a0a, #ff141414, #ffe8e8e8, #ffffffff, #ffe8e8e8, #ff141414, #ff0a0a0a, #19000000, #ffa0a0a0, #ff0a0a0a, #ffffffff, #ffa0a0a0, #ff1e1e1e, #ff000000, #f21e1e1e, #ffe8e8e8, #ff606060, #ffa0a0a0
disabled_colors=#ff606060, #ff1e1e1e, #ff333333, #ff282828, #ff0a0a0a, #ff141414, #ff606060, #ffffffff, #ff606060, #ff141414, #ff0a0a0a, #19000000, #ff282828, #ff606060, #ff606060, #ff606060, #ff1e1e1e, #ff000000, #f21e1e1e, #ff606060, #ff404040, #ff606060
