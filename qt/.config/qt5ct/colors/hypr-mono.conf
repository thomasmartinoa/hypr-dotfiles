; hypr-dotfiles — monochrome Qt5 colour scheme
; ============================================================================
; Mirrors ~/.config/hypr-theme/palette.css and qt6ct/colors/hypr-mono.conf.
;
; 21 #AARRGGBB values in Qt5's QPalette::ColorRole order. This is the ONE
; difference from the qt6ct copy: Qt5 has no Accent role (added in Qt 6.6),
; so this file has 21 values where the qt6ct one has 22.
;
;   0 WindowText  1 Button      2 Light       3 Midlight   4 Dark
;   5 Mid         6 Text        7 BrightText  8 ButtonText 9 Base
;  10 Window     11 Shadow     12 Highlight  13 HighlightedText
;  14 Link       15 LinkVisited 16 AlternateBase 17 NoRole
;  18 ToolTipBase 19 ToolTipText 20 PlaceholderText
